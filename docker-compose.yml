services:
  glance-backup-status:
    build: .
    restart: unless-stopped
    network_mode: bridge

    ports:
      - "${WIDGET_BIND:-0.0.0.0}:${WIDGET_PORT:-3030}:3030"

    env_file:
      - .env

    environment:
      SSH_KEY: /ssh/id_ed25519

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./data:/data
      - ./ssh:/ssh:ro
      - /etc/localtime:/etc/localtime:ro

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3030/health', timeout=2)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
